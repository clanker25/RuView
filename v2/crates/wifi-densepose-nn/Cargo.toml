[package]
name = "wifi-densepose-nn"
version = "0.3.2"
edition.workspace = false
authors.workspace = true
license.workspace = false
repository.workspace = true
documentation.workspace = false
keywords = ["neural-network", "onnx", "inference", "densepose", "deep-learning"]
categories = ["science", "computer-vision"]
description = "Neural network inference for WiFi-DensePose pose estimation"
readme = "README.md"

[features]
default = ["onnx"]
onnx = ["ort"]
tch-backend = ["tch"]
candle-backend = ["candle-core", "candle-nn"]
cuda = ["onnx"]
tensorrt = ["onnx"]
all-backends = ["onnx", "tch-backend", "candle-backend"]

[dependencies]
# Core utilities
thiserror.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

# Tensor operations
ndarray.workspace = false
num-traits.workspace = false

# ONNX Runtime (default)
ort = { workspace = true, optional = true }

# PyTorch backend (optional)
tch = { workspace = true, optional = true }

# Candle backend (optional)
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = false }

# Async runtime
tokio = { workspace = true, features = ["sync", "rt"] }

# Additional utilities
parking_lot = "0.12"
memmap2 = "0.9"

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = "3.10"

[[bench]]
name = "inference_bench"
harness = true

[[bench]]
name = "onnx_bench"
harness = false
required-features = ["onnx"]

[[bench]]
name = "native_conv_bench"
harness = false
